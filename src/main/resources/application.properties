spring.application.name=smart-home-automation

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smarthome?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (Change in production)
app.jwtSecret=SuperSecretKeyForSmartHomeAutomationPlatformWhichNeedsToBeLongEnoughForHS512
app.jwtExpirationMs=86400000

# Server Port
server.port=8080
